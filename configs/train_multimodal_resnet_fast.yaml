defaults:
  - base

train:
  task: multimodal_classification
  batch_size: 32
  epochs: 16
  learning_rate: 0.0002
  image_size: 256
  max_tree_tokens: 256
  tree_input_dim: 2048
  tree_profile: semantic_v3
  num_workers: 8
  weight_decay: 0.0005
  use_class_weights: false
  sampler: weighted_random
  label_smoothing: 0.03
  use_amp: true
  augmentation: ui_light
  output_name: train_multimodal_resnet_fast
  freeze_backbone_epochs: 1
  precompute_tree_features: true
  tree_cache_workers: 12
  tree_feature_chunk_size: 2048
  tree_vectorizer:
    name: hybrid_hashing
    word_dim: 1024
    char_dim: 1024
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
  auxiliary_loss:
    image_weight: 0.15
    tree_weight: 0.15
  optimizer:
    name: adamw
  scheduler:
    name: cosine
    eta_min: 0.000001

model:
  image_backbone: resnet18
  image_dim: 384
  tree_hidden_dim: 384
  fusion_dim: 384
  tree_encoder_type: deep
  fusion_mode: gated
  dropout: 0.2
  use_aux_heads: true
  branch_dropout: 0.08
